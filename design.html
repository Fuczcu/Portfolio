<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            Portfolio
        </title>
        <link rel="stylesheet" href="assets/css/bootstrap/bootstrap.min.css">
        <link rel="stylesheet" href="assets/css/index.css">
    </head>
    <body>
        <a class="btn-subtle theme-inverse m-5 position-fixed end-0 bottom-0" href="index.html#design-link">
            Zurück zum Portfolio
        </a>
        <div class="position-fixed w-100 h-100 image-view d-flex d-none justify-content-center align-items-center" id="image-view-container">
            <div class="position-absolute top-0 end-0">
                <button class="btn-outline theme-inverse m-5" id="image-view-close">
                    Schließen
                </button>
            </div>
            <img
                src=""
                alt="Test"
                class="image-view-image rounded"
            >
        </div>
        <div class="row x-padding" id="design-picture-container">
            <h3 class="monsterrat-bold test-margin-top">Gestalterisch</h3>
            <div class="row x-padding test-margin">
                <div class="col-12 md:col-4 test-margin d-flex justify-content-center align-items-center photography-container">
                    <img
                        src="assets/img/gestaltung/cover.jpg"
                        alt="Fotografie"
                        class="w-75 rounded photography-img"
                    >
                </div>
                <div class="col-12 md:col-4 test-margin d-flex justify-content-center align-items-center photography-container">
                    <img
                        src="assets/img/gestaltung/flurbildt.png"
                        alt="Fotografie"
                        class="w-75 rounded photography-img"
                    >
                </div>
                <div class="col-12 md:col-4 test-margin d-flex justify-content-center align-items-center photography-container">
                    <img
                        src="assets/img/gestaltung/infografik.jpg"
                        alt="Fotografie"
                        class="w-75 rounded photography-img"
                    >
                </div>
                <div class="col-12 md:col-4 test-margin d-flex justify-content-center align-items-center photography-container">
                    <img
                        src="assets/img/gestaltung/praktikum_poster.jpg"
                        alt="Fotografie"
                        class="w-75 rounded photography-img"
                    >
                </div>
                <div class="col-12 md:col-4 test-margin d-flex justify-content-center align-items-center photography-container">
                    <img
                        src="assets/img/gestaltung/resohaus_brief.jpg"
                        alt="Fotografie"
                        class="w-75 rounded photography-img"
                    >
                </div>
                <div class="col-12 md:col-4 test-margin d-flex justify-content-center align-items-center photography-container">
                    <img
                        src="assets/img/gestaltung/resohaus_postkarte.jpg"
                        alt="Fotografie"
                        class="w-75 rounded photography-img"
                    >
                </div>
                <div class="col-12 md:col-4 test-margin d-flex justify-content-center align-items-center photography-container">
                    <img
                        src="assets/img/gestaltung/verpackung.jpg"
                        alt="Fotografie"
                        class="w-75 rounded photography-img"
                    >
                </div>
            </div>
            <div class="row justify-content-center test-margin">
                <button type="button" class="btn-subtle theme-inverse w-auto px-5 py-3 test-margin-bottom" id="load-more-designs">
                    Mehr laden
                </button>
            </div>
        </div>
    </body>
    <script src="assets/js/bootstrap/bootstrap.min.js"></script>
    <script src="assets/js/index.js"></script>
    <script>
        new PictureGallery("#design-picture-container", "#load-more-designs");
    </script>
</html>
